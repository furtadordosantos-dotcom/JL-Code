<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apostila | JL Code</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap student-page"><a class="brand" href="apostilas.html"><span>←</span>Apostilas</a><p id="viewer-message">Carregando apostila…</p><iframe id="apostila-viewer" title="Apostila protegida" style="width:100%;height:78vh;border:1px solid #294363;border-radius:12px;display:none"></iframe></main><script>const s=new URLSearchParams(location.search).get('slug'),f=document.querySelector('#apostila-viewer'),m=document.querySelector('#viewer-message');if(!s){m.textContent='Apostila inválida.'}else fetch('/api/apostilas/'+encodeURIComponent(s)+'/pdf',{credentials:'include',headers:{Accept:'application/pdf'}}).then(async r=>{if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'Não foi possível abrir esta apostila.')}return r.blob()}).then(b=>{f.src=URL.createObjectURL(b);f.style.display='block';m.textContent='';}).catch(e=>m.textContent=e.message);</script></body></html>
