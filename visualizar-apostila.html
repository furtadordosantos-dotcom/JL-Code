<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apostila | JL Code</title><link rel="stylesheet" href="style.css"></head><body><main class="wrap student-page"><a class="brand" href="apostilas.html"><span>←</span>Apostilas</a><p id="viewer-message">Carregando apostila…</p><iframe id="apostila-viewer" title="Apostila protegida" style="width:100%;height:78vh;border:1px solid #294363;border-radius:12px;display:none"></iframe></main><script>const s=new URLSearchParams(location.search).get('slug'),f=document.querySelector('#apostila-viewer');fetch('/api/apostilas/'+encodeURIComponent(s)+'/pdf',{credentials:'include'}).then(r=>{if(!r.ok)throw Error();return r.blob()}).then(b=>{f.src=URL.createObjectURL(b);f.style.display='block';document.querySelector('#viewer-message').textContent='';}).catch(()=>document.querySelector('#viewer-message').textContent='Acesso negado. Entre na conta correta ou escolha um plano.');</script></body></html>
