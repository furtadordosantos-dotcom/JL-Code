<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apostila | JL Code</title><link rel="stylesheet" href="style.css"></head><body class="reader-page"><main class="wrap student-page"><a class="brand" href="apostilas.html"><span>←</span>Apostilas</a><section class="reader-shell"><div class="reader-toolbar"><div><p class="eyebrow">LEITURA PROTEGIDA</p><h1>Material de estudo</h1></div><p>Visualização vinculada à sua conta. O download, impressão e compartilhamento normal foram desativados.</p></div><p id="viewer-message">Carregando apostila…</p><iframe id="apostila-viewer" title="Apostila protegida" sandbox="allow-same-origin" referrerpolicy="no-referrer" allow="clipboard-read 'none'; clipboard-write 'none'; web-share 'none'" style="display:none"></iframe></section></main><script>const s=new URLSearchParams(location.search).get('slug'),f=document.querySelector('#apostila-viewer'),m=document.querySelector('#viewer-message');function block(e){if((e.ctrlKey||e.metaKey)&&['p','s'].includes(e.key.toLowerCase())){e.preventDefault();m.textContent='A impressão e o salvamento estão desativados neste material protegido.';}}document.addEventListener('keydown',block);document.addEventListener('contextmenu',e=>{if(e.target.closest('#apostila-viewer'))e.preventDefault()});if(!s){m.textContent='Apostila inválida.'}else{const url='/api/apostilas/'+encodeURIComponent(s)+'/pdf#toolbar=0&navpanes=0&scrollbar=1&view=FitH';fetch(url,{credentials:'include',headers:{Accept:'application/pdf'}}).then(async r=>{if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'Não foi possível abrir esta apostila.')}f.src=url;f.style.display='block';m.textContent='';}).catch(e=>m.textContent=e.message);}</script></body></html>
